[package]
name = "plugin"
description = "A Crook plugin that says hello in the header."
authors.workspace = true
edition.workspace = true
version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# `cdylib` is what `wasm32-unknown-unknown` needs to produce a module with
# exports rather than a Rust archive nothing outside Rust can load.
crate-type = ["cdylib", "rlib"]

[dependencies]
# One, and it is the whole API. The wire format is inside it — `to_bytes` and
# `from_bytes` are its functions — so a plugin never names `postcard` or
# `serde` itself, and a plugin that did would be pinning a version of the
# encoding against the host's.
crook_plugin_api.workspace = true
